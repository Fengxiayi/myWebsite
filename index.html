<style>
:root{
  --bg:#EDF1F7;
  --surface:#FFFFFF;
  --ink:#0F172A;
  --muted:#5B6B84;
  --line:#E2E9F3;
  --hero1:#0A1B3C;
  --hero2:#0F3D6E;
  --hero3:#0C5C72;
  --accent:#67E8F9;
  --radius:16px;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 8px 24px -12px rgba(15,23,42,.12);
  --cat:#2563EB;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.container{max-width:1180px;margin:0 auto;padding:0 20px}

/* ===== Hero ===== */
.hero{
  position:relative;color:#F8FAFC;
  background:
    radial-gradient(1100px 480px at 82% -10%, rgba(103,232,249,.16), transparent 60%),
    radial-gradient(900px 420px at 8% 0%, rgba(56,130,246,.18), transparent 55%),
    linear-gradient(140deg,var(--hero1) 0%,var(--hero2) 52%,var(--hero3) 100%);
  padding:54px 0 74px;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.14) 1px, transparent 1px);
  background-size:26px 26px;
  opacity:.35;
}
.hero .container{position:relative;z-index:1}
.hero-top{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  flex-wrap:wrap;margin-bottom:38px;
}
.clock{text-align:right}
.clock-time{
  font-family:'Noto Serif SC','Songti SC',serif;font-weight:700;
  font-size:34px;letter-spacing:1px;line-height:1.2;
  font-variant-numeric:tabular-nums;
}
.clock-date{font-size:13px;color:rgba(248,250,252,.72);margin-top:2px}
.greeting{
  font-family:'Noto Serif SC','Songti SC',serif;font-weight:600;
  font-size:20px;color:var(--accent);margin-bottom:6px;
}
.hero h1{
  font-family:'Noto Serif SC','Songti SC',serif;
  font-weight:900;font-size:44px;letter-spacing:2px;line-height:1.25;
}
.hero-sub{margin-top:10px;font-size:15px;color:rgba(248,250,252,.8);max-width:520px}

/* hero search */
.search-box{
  margin-top:34px;max-width:680px;
  display:flex;background:rgba(255,255,255,.98);border-radius:14px;
  padding:6px;box-shadow:0 18px 44px -16px rgba(2,10,28,.55);
}
.search-box select{
  border:none;background:#EEF2F8;color:var(--ink);border-radius:9px;
  padding:0 12px;font-size:14px;font-family:inherit;outline:none;cursor:pointer;
  flex:0 0 auto;max-width:104px;
}
.search-box input{
  flex:1;border:none;outline:none;padding:12px 14px;font-size:15px;
  background:transparent;color:var(--ink);min-width:0;
}
.search-box input::placeholder{color:#9AA7BA}
.search-box button{
  border:none;cursor:pointer;border-radius:9px;padding:0 22px;
  background:linear-gradient(135deg,#0E7C96,#0F3D6E);color:#fff;
  font-size:15px;font-family:inherit;font-weight:500;letter-spacing:1px;
  transition:filter .2s;flex:0 0 auto;
}
.search-box button:hover{filter:brightness(1.12)}

/* ===== Sticky bar ===== */
.sticky-bar{
  position:sticky;top:0;z-index:50;
  background:rgba(237,241,247,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.bar-inner{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.chip{
  font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);
  transition:all .18s;white-space:nowrap;font-family:inherit;
}
.chip:hover{color:var(--ink);border-color:#C7D3E4;transform:translateY(-1px)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.filter-wrap{position:relative;flex:0 0 auto}
.filter-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:#8A98AE;pointer-events:none}
.filter-input{
  border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:8px 14px 8px 34px;font-size:13px;outline:none;width:210px;
  font-family:inherit;color:var(--ink);transition:border-color .18s,width .18s;
}
.filter-input:focus{border-color:#7FA6C9;width:250px}
.filter-input::placeholder{color:#9AA7BA}

/* ===== Sections ===== */
main{padding:40px 0 64px}
.section{margin-bottom:46px}
.sec-head{
  display:flex;align-items:center;gap:10px;margin-bottom:18px;
  padding-bottom:10px;border-bottom:1px solid var(--line);
}
.sec-icon{
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--cat) 12%, #fff);color:var(--cat);flex:0 0 auto;
}
.sec-icon svg{width:17px;height:17px}
.sec-title{font-family:'Noto Serif SC','Songti SC',serif;font-size:19px;font-weight:700;letter-spacing:1px}
.sec-count{font-size:12px;color:var(--muted);background:#E7EDF5;padding:2px 9px;border-radius:999px;margin-left:2px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;gap:9px;min-height:118px;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.card:hover{
  transform:translateY(-3px);border-color:var(--cat);
  box-shadow:0 14px 30px -14px rgba(15,23,42,.22);
}
.card-row{display:flex;align-items:center;gap:12px;min-width:0}
.tile{
  width:40px;height:40px;border-radius:11px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--cat) 13%, #fff);
  color:var(--cat);font-weight:700;font-size:17px;
  font-family:'Noto Serif SC','Songti SC',serif;
}
.card-meta{min-width:0;flex:1}
.card-name{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-url{display:block;font-size:11.5px;color:#93A1B5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.card-desc{font-size:12.5px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.section.is-empty{display:none}
.empty-state{
  display:none;text-align:center;padding:56px 20px;color:var(--muted);
  background:var(--surface);border:1px dashed #C9D6E6;border-radius:var(--radius);
}
.empty-state.show{display:block}
.empty-state svg{width:34px;height:34px;stroke:#B7C4D6;margin-bottom:10px}
.empty-state p{font-size:14px}

/* ===== Footer ===== */
footer{
  border-top:1px solid var(--line);background:var(--surface);
  padding:26px 0;color:var(--muted);font-size:13px;
}
.foot-inner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.foot-inner strong{color:var(--ink);font-weight:600}

/* back to top */
.to-top{
  position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:12px;
  background:#12294F;color:#fff;border:none;cursor:pointer;opacity:0;pointer-events:none;
  transform:translateY(10px);transition:all .25s;display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 28px -10px rgba(10,27,60,.5);z-index:60;
}
.to-top.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.to-top:hover{background:#0E5A6B}
.to-top svg{width:19px;height:19px;stroke:#fff}

/* ===== Responsive ===== */
@media (max-width:1024px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:720px){
  .hero{padding:40px 0 56px}
  .hero h1{font-size:32px}
  .clock-time{font-size:26px}
  .hero-top{margin-bottom:26px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .card{padding:13px;min-height:0}
  .card-desc{-webkit-line-clamp:1;font-size:13px}
  .card-url{font-size:12px}
  .search-box{flex-wrap:wrap}
  .search-box select{max-width:88px}
  .search-box button{padding:0 16px;font-size:16px;min-height:44px}
  .search-box input{font-size:16px}
  .chip{padding:8px 14px;min-height:44px;display:inline-flex;align-items:center}
  .filter-input{width:170px;font-size:16px}
  .filter-input:focus{width:200px}
}
@media (max-width:420px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .clock-time{font-size:22px}
  .hero h1{font-size:27px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}
</style>
</head>

<header class="hero">

        <div class="clock-time" id="clockTime">--:--:--</div>
        <div class="clock-date" id="clockDate"></div>

    </div>

    <form class="search-box" id="searchForm" role="search" aria-label="搜索">

</header>

  </div>
  <div id="sections"></div>
</main>

<!-- ===== Footer ===== -->
<footer>
  <div class="container foot-inner">
    <div>共收录 <strong id="totalCount">0</strong> 个常用站点</div>
    <div>站点列表内置在页面代码中，可自行增删维护</div>
  </div>
</footer>

<button class="to-top" id="toTop" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

/* ===== 搜索引擎跳转 ===== */
var ENGINES = {
  baidu:"https://www.baidu.com/s?wd=",
  google:"https://www.google.com/search?q=",
  bing:"https://www.bing.com/search?q=",
  bingcn:"https://cn.bing.com/search?q=",
  zhihu:"https://www.zhihu.com/search?type=content&q="
};

/* ===== 工具函数 ===== */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function shortUrl(u){return u.replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/\/$/,"")}

/* ===== 渲染 ===== */
var sectionsWrap = document.getElementById("sections");
var chipsWrap = document.getElementById("chips");
var total = 0;

CATS.forEach(function(cat,ci){
  total += cat.sites.length;

  /* 分类导航 chip */
  var chip = document.createElement("button");
  chip.type = "button";
  chip.className = "chip";
  chip.setAttribute("aria-label","跳转到"+cat.name);
  chip.innerHTML = '<span class="dot" style="background:'+cat.color+'"></span>'+esc(cat.name);
  chip.addEventListener("click",function(){
    document.getElementById("sec-"+cat.id).scrollIntoView({behavior:"smooth",block:"start"});
  });
  chipsWrap.appendChild(chip);

  /* 分类区块 */
  var sec = document.createElement("section");
  sec.className = "section";
  sec.id = "sec-"+cat.id;
  sec.style.setProperty("--cat",cat.color);

  var head = document.createElement("div");
  head.className = "sec-head";
  head.innerHTML =
    '<div class="sec-icon">'+ICONS[cat.icon]+'</div>'+
    '<h2 class="sec-title">'+esc(cat.name)+'</h2>'+
    '<span class="sec-count">'+cat.sites.length+' 个</span>';
  sec.appendChild(head);

  var grid = document.createElement("div");
  grid.className = "grid";

  cat.sites.forEach(function(site){
    var a = document.createElement("a");
    a.className = "card";
    a.href = site.u;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.setAttribute("data-name",site.n.toLowerCase());
    a.setAttribute("data-desc",site.d.toLowerCase());
    a.setAttribute("data-cat",cat.name);
    a.innerHTML =
      '<div class="card-row">'+
        '<span class="tile">'+esc(site.n.charAt(0))+'</span>'+
        '<span class="card-meta">'+
          '<span class="card-name">'+esc(site.n)+'</span>'+
          '<span class="card-url">'+esc(shortUrl(site.u))+'</span>'+
        '</span>'+
      '</div>'+
      '<span class="card-desc">'+esc(site.d)+'</span>';
    grid.appendChild(a);
  });

  sec.appendChild(grid);
  sectionsWrap.appendChild(sec);
});

document.getElementById("totalCount").textContent = total;

/* ===== 实时筛选 ===== */
var filterInput = document.getElementById("filterInput");
var emptyState = document.getElementById("emptyState");

filterInput.addEventListener("input",function(){
  var q = filterInput.value.trim().toLowerCase();
  var anyVisible = false;

  CATS.forEach(function(cat){
    var sec = document.getElementById("sec-"+cat.id);
    var cards = sec.querySelectorAll(".card");
    var vis = 0;
    cards.forEach(function(card){
      var hit = !q ||
        card.getAttribute("data-name").indexOf(q) > -1 ||
        card.getAttribute("data-desc").indexOf(q) > -1 ||
        card.getAttribute("data-cat").toLowerCase().indexOf(q) > -1;
      card.style.display = hit ? "" : "none";
      if(hit) vis++;
    });
    sec.classList.toggle("is-empty", vis === 0);
    if(vis > 0) anyVisible = true;
  });

  emptyState.classList.toggle("show", !anyVisible);
});

/* "/" 快捷聚焦筛选框 */
document.addEventListener("keydown",function(e){
  var tag = document.activeElement && document.activeElement.tagName;
  if(e.key === "/" && tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA"){
    e.preventDefault();
    filterInput.focus();
  }
});

/* ===== Hero 搜索 ===== */
var searchForm = document.getElementById("searchForm");
var engineSel = document.getElementById("engine");
var searchInput = document.getElementById("searchInput");

try{
  var saved = localStorage.getItem("nav_engine");
  if(saved && ENGINES[saved]) engineSel.value = saved;
}catch(e){}

engineSel.addEventListener("change",function(){
  try{localStorage.setItem("nav_engine",engineSel.value)}catch(e){}
});

searchForm.addEventListener("submit",function(e){
  e.preventDefault();
  var kw = searchInput.value.trim();
  if(!kw) { searchInput.focus(); return; }
  window.open(ENGINES[engineSel.value] + encodeURIComponent(kw), "_blank", "noopener");
});

/* ===== 时钟与问候 ===== */
var WEEK = ["日","一","二","三","四","五","六"];
function pad(n){return n < 10 ? "0"+n : ""+n}

function tick(){
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
  document.getElementById("clockTime").textContent = pad(h)+":"+pad(m)+":"+pad(s);
  document.getElementById("clockDate").textContent =
    now.getFullYear()+" 年 "+(now.getMonth()+1)+" 月 "+now.getDate()+" 日 · 星期"+WEEK[now.getDay()];

  var g;
  if(h >= 5 && h < 11) g = "早上好";
  else if(h >= 11 && h < 13) g = "中午好";
  else if(h >= 13 && h < 18) g = "下午好";
  else if(h >= 18 && h < 23) g = "晚上好";
  else g = "夜深了";
  document.getElementById("greeting").textContent = g+"，今天想去哪儿？";
}
tick();
setInterval(tick,1000);

/* ===== 回到顶部 ===== */
var toTop = document.getElementById("toTop");
window.addEventListener("scroll",function(){
  toTop.classList.toggle("show", window.scrollY > 420);
},{passive:true});
toTop.addEventListener("click",function(){
  window.scrollTo({top:0,behavior:"smooth"});
});
